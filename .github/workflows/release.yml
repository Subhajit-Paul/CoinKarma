name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create a GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        # Signs with the debug keystore if no release keystore is configured.
        # To use a real keystore, add KEYSTORE_FILE (base64), KEYSTORE_PASSWORD,
        # KEY_ALIAS, and KEY_PASSWORD as repository secrets and update this step.
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_FILE }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
        continue-on-error: true   # falls back to unsigned if secrets not set

      - name: Rename APK
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          APK_SIGNED="app/build/outputs/apk/release/app-release-signed.apk"
          APK_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -f "$APK_SIGNED" ]; then
            mv "$APK_SIGNED" "CoinKarma-${TAG}.apk"
          else
            mv "$APK_UNSIGNED" "CoinKarma-${TAG}.apk" 2>/dev/null || \
            mv "$(ls app/build/outputs/apk/release/*.apk | head -1)" "CoinKarma-${TAG}.apk"
          fi
          echo "APK_NAME=CoinKarma-${TAG}.apk" >> $GITHUB_ENV

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          awk "/^## \[${TAG}\]/{found=1; next} /^## \[/{found=0} found" CHANGELOG.md > release_notes.txt
          cat release_notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CoinKarma ${{ github.ref_name }}"
          body_path: release_notes.txt
          files: ${{ env.APK_NAME }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
